name: Build sing-box Ruleset

on:
  push:
    paths:
      - "singbox/**/*.json"
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:
    inputs:
      files:
        description: "指定文件名（如 direct.json），留空则编译改动的文件"
        required: false
      build_all:
        description: "强制打包目录下所有 .json 文件"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: push-to-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find target files
        id: files
        run: |
          FILES=""
          if [ "${{ github.event.inputs.build_all }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            for f in singbox/rules/*.json; do
              [ -f "$f" ] && FILES="$FILES $f"
            done
          elif [ -n "${{ github.event.inputs.files }}" ]; then
            for fname in ${{ github.event.inputs.files }}; do
              fpath="singbox/rules/$fname"
              if [ -f "$fpath" ]; then
                FILES="$FILES $fpath"
              fi
            done
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- "singbox/rules/" 2>/dev/null || git diff --name-only HEAD -- "singbox/rules/")
            for f in $CHANGED; do
              if [[ "$f" == *.json ]]; then
                [ -f "$f" ] && FILES="$FILES $f"
              fi
            done
          fi
          if [ -z "$FILES" ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Target files: $FILES"

      - name: Download sing-box
        if: steps.files.outputs.has_files == 'true'
        run: |
          ASSET_URL=$(curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*linux-amd64[^"]*\.tar\.gz"' \
            | head -1 \
            | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: 无法获取 sing-box 下载链接"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o sing-box.tar.gz
          mkdir -p sing-box-extract
          tar xzf sing-box.tar.gz -C sing-box-extract --strip-components=0
          SINGBOX_BIN=$(find sing-box-extract -name "sing-box" -type f | head -1)
          if [ -z "$SINGBOX_BIN" ]; then
            echo "ERROR: 未找到 sing-box 二进制文件"
            echo "=== 解压内容 ==="
            find sing-box-extract -type f
            exit 1
          fi
          cp "$SINGBOX_BIN" ./sing-box
          rm -rf sing-box-extract
          chmod +x sing-box
          ./sing-box version

      - name: Validate json files
        if: steps.files.outputs.has_files == 'true'
        run: |
          for f in ${{ steps.files.outputs.files }}; do
            echo "Validating $f ..."
            python3 -c "import json; json.load(open('$f'))" || { echo "ERROR: $f JSON 语法错误"; exit 1; }
          done
          echo "All files passed validation"

      - name: Compile rule-sets
        if: steps.files.outputs.has_files == 'true'
        run: |
          mkdir -p output
          for f in ${{ steps.files.outputs.files }}; do
            name=$(basename "$f" .json)
            echo "Compiling $f -> output/${name}.srs"
            ./sing-box rule-set compile -o "output/${name}.srs" "$f"
          done

      - name: Upload artifacts
        if: steps.files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: srs-rulesets
          path: output/*.srs

      - name: Checkout rules branch
        if: steps.files.outputs.has_files == 'true'
        uses: actions/checkout@v4
        with:
          ref: rules
          path: rules-repo
          fetch-depth: 1
        continue-on-error: true
        id: checkout-rules

      - name: Init rules branch if not exists
        if: steps.files.outputs.has_files == 'true' && steps.checkout-rules.outcome == 'failure'
        run: |
          mkdir -p rules-repo
          cd rules-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b rules
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

      - name: Push to rules branch
        if: steps.files.outputs.has_files == 'true'
        run: |
          mkdir -p rules-repo/singbox
          cp output/*.srs rules-repo/singbox/
          if ! ls rules-repo/singbox/*.srs 2>/dev/null | head -1 > /dev/null; then
            echo "No .srs files to commit"
            exit 0
          fi

          cd rules-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add singbox/
          git diff --cached --quiet || git commit -m "chore: update sing-box rulesets [skip ci]"
          git push
