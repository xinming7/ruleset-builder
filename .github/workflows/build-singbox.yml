name: Build sing-box Ruleset

on:
  push:
    paths:
      - "singbox/**/*.json"
    branches: [main]
  schedule:
    - cron: '10 3 * * 1'  # 每周一 UTC 03:10（北京时间 11:10），与 mihomo 的 03:00 错峰
  workflow_dispatch:
    inputs:
      files:
        description: "指定文件名（如 direct.json），留空则编译改动的文件"
        required: false
      build_all:
        description: "强制打包目录下所有 .json 文件"
        required: false
        type: boolean
        default: false

concurrency:
  group: push-to-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find target files
        id: files
        env:
          FILES_INPUT: ${{ github.event.inputs.files }}
          BUILD_ALL: ${{ github.event.inputs.build_all }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          declare -a TARGETS=()

          if [ "$BUILD_ALL" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            mapfile -t TARGETS < <(find singbox/rules -maxdepth 1 -name '*.json' | sort)
          elif [ -n "${FILES_INPUT:-}" ]; then
            read -ra NAMES <<< "$FILES_INPUT"
            for fname in "${NAMES[@]}"; do
              fpath="singbox/rules/$fname"
              if [ -f "$fpath" ]; then
                TARGETS+=("$fpath")
              else
                echo "::warning::指定的文件不存在，已忽略: $fname"
              fi
            done
          else
            # 用 push 事件的 base commit 做全区间 diff；HEAD~1 只能看到最后一个 commit，会漏检
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              mapfile -t CHANGED < <(git diff --name-only "$BEFORE" HEAD -- 'singbox/rules/' || true)
            else
              # force-push / rebase 后 base commit 可能不存在，宁可全量重建也不漏检
              echo "::notice::base commit 不可用（${BEFORE:-空}），按全量重建处理"
              mapfile -t CHANGED < <(find singbox/rules -maxdepth 1 -name '*.json' | sort)
            fi
            for f in "${CHANGED[@]}"; do
              [[ "$f" == *.json ]] || continue
              [ -f "$f" ] || continue
              TARGETS+=("$f")
            done
          fi

          if [ "${#TARGETS[@]}" -eq 0 ]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "没有需要编译的文件"
          else
            FILES="${TARGETS[*]}"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
            echo "files=$FILES" >> "$GITHUB_OUTPUT"
            echo "Target files: $FILES"
          fi

      - name: Download sing-box from release
        if: steps.files.outputs.has_files == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/kernel-v1/sing-box-linux-amd64" -o sing-box
          chmod +x sing-box

          # 与 kernel-manifest.json 里记录的 SHA256 比对，防止资产被误覆盖或下载截断
          mkdir -p .kernel
          if gh release download kernel-v1 -p kernel-manifest.json -D .kernel --clobber 2>/dev/null; then
            EXPECTED=$(jq -r '.assets["sing-box"].sha256 // ""' .kernel/kernel-manifest.json)
            if [ -n "$EXPECTED" ]; then
              ACTUAL=$(sha256sum sing-box | awk '{print $1}')
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::内核 SHA256 不匹配（期望 $EXPECTED / 实际 $ACTUAL），请检查 kernel-v1 资产"
                exit 1
              fi
              echo "SHA256 校验通过: $ACTUAL"
            else
              echo "::warning::manifest 中缺少 sing-box 的 SHA256，跳过校验"
            fi
          else
            echo "::warning::取不到 kernel-manifest.json，跳过 SHA256 校验"
          fi

          ./sing-box version

      - name: Validate json files
        if: steps.files.outputs.has_files == 'true'
        env:
          TARGETS: ${{ steps.files.outputs.files }}
        run: |
          set -uo pipefail
          read -ra LIST <<< "$TARGETS"
          for f in "${LIST[@]}"; do
            echo "Validating $f ..."
            python3 -c "import json; json.load(open('$f'))" || { echo "ERROR: $f JSON 语法错误"; exit 1; }
          done
          echo "All files passed validation"

      - name: Compile rule-sets
        if: steps.files.outputs.has_files == 'true'
        env:
          TARGETS: ${{ steps.files.outputs.files }}
        run: |
          set -euo pipefail
          mkdir -p output
          read -ra LIST <<< "$TARGETS"
          for f in "${LIST[@]}"; do
            name=$(basename "$f" .json)
            echo "Compiling $f -> output/${name}.srs"
            ./sing-box rule-set compile -o "output/${name}.srs" "$f"
          done

      - name: Upload artifacts
        if: steps.files.outputs.has_files == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: srs-rulesets
          path: output/*.srs

      - name: Publish to rules branch
        if: steps.files.outputs.has_files == 'true'
        uses: ./.github/actions/publish-rules
        with:
          dir: singbox
          source-dir: singbox/rules
          source-patterns: "*.json"
          ext: srs
          artifact-dir: output
          message: "chore: update sing-box rulesets [skip ci]"
          token: ${{ github.token }}
