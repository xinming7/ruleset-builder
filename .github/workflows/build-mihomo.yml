name: Build mihomo Ruleset

on:
  push:
    paths:
      - "mihomo/**/*.yaml"
      - "mihomo/**/*.txt"
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:
    inputs:
      behavior:
        description: "规则类型"
        required: false
        type: choice
        default: all
        options:
          - all
          - domain
          - ipcidr
      build_all:
        description: "强制打包所有文件（忽略变更检测）"
        required: false
        type: boolean
        default: false

concurrency:
  group: push-to-rules
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: set-matrix
        env:
          MODE: ${{ github.event.inputs.behavior }}
          BUILD_ALL: ${{ github.event.inputs.build_all }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          BEHAVIORS='[]'
          HAS_CHANGES=false

          if [ "$BUILD_ALL" = "true" ] || [ "${{ github.event_name }}" = "schedule" ] || [ -n "${MODE:-}" ]; then
            case "${MODE:-all}" in
              all|"") BEHAVIORS='["domain","ipcidr"]' ;;
              domain|ipcidr) BEHAVIORS=$(jq -c -n --arg b "$MODE" '[$b]') ;;
              *) echo "::error::未知 behavior 取值: $MODE"; exit 1 ;;
            esac
            HAS_CHANGES=true
          else
            # 用 push 事件的 base commit 做全区间 diff；HEAD~1 只能看到最后一个 commit，会漏检
            if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              CHANGED=$(git diff --name-only "$BEFORE" HEAD -- 'mihomo/' || true)
            else
              # force-push / rebase 后 base commit 可能不存在，宁可全量重建也不漏检
              echo "::notice::base commit 不可用（${BEFORE:-空}），按全量重建处理"
              CHANGED="mihomo/domain/ mihomo/ipcidr/"
            fi
            for beh in domain ipcidr; do
              if echo "$CHANGED" | grep -q "^mihomo/$beh/"; then
                BEHAVIORS=$(echo "$BEHAVIORS" | jq -c --arg b "$beh" '. + [$b] | unique')
              fi
            done
            if [ "$BEHAVIORS" != "[]" ]; then
              HAS_CHANGES="true"
            fi
          fi

          echo "matrix={\"behavior\":$BEHAVIORS}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Detected behaviors: $BEHAVIORS"

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/kernel-v1/mihomo-linux-amd64" -o mihomo-bin
          chmod +x mihomo-bin

          # 与 kernel-manifest.json 里记录的 SHA256 比对，防止资产被误覆盖或下载截断
          mkdir -p .kernel
          if gh release download kernel-v1 -p kernel-manifest.json -D .kernel --clobber 2>/dev/null; then
            EXPECTED=$(jq -r '.assets.mihomo.sha256 // ""' .kernel/kernel-manifest.json)
            if [ -n "$EXPECTED" ]; then
              ACTUAL=$(sha256sum mihomo-bin | awk '{print $1}')
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::内核 SHA256 不匹配（期望 $EXPECTED / 实际 $ACTUAL），请检查 kernel-v1 资产"
                exit 1
              fi
              echo "SHA256 校验通过: $ACTUAL"
            else
              echo "::warning::manifest 中缺少 mihomo.sha256，跳过校验"
            fi
          else
            echo "::warning::取不到 kernel-manifest.json，跳过 SHA256 校验"
          fi

          ./mihomo-bin -v

      - name: Validate yaml/txt files
        run: |
          pip install -q -r requirements.txt
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/"$BEHAVIOR"/*.yaml mihomo/"$BEHAVIOR"/*.txt; do
            [ -f "$f" ] || continue
            echo "Validating $f ..."
            if [[ "$f" == *.yaml ]]; then
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || { echo "ERROR: $f YAML 语法错误"; exit 1; }
            fi
            if [[ "$f" == *.txt ]]; then
              if ! grep -q '[^[:space:]]' "$f"; then
                echo "ERROR: $f 文件为空"
                exit 1
              fi
            fi
          done
          echo "All files passed validation"

      - name: Build ${{ matrix.behavior }} rulesets
        run: |
          mkdir -p output
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/"$BEHAVIOR"/*.yaml mihomo/"$BEHAVIOR"/*.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/\.\(yaml\|txt\)$//')
            if [[ "$f" == *.txt ]]; then
              fmt="txt"
            else
              fmt="yaml"
            fi
            echo "Converting $f -> output/${name}.mrs (format=$fmt)"
            ./mihomo-bin convert-ruleset "$BEHAVIOR" "$fmt" "$f" "output/${name}.mrs"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrs-${{ matrix.behavior }}
          path: output/*.mrs

  commit:
    needs: build
    # 只在构建成功时发布：构建失败/部分失败时坚决不推，避免产物半新半旧
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 注意顺序：必须先 checkout 再下载 artifact。
      # actions/checkout 默认 clean: true（git clean -ffdx），后执行会把已下载的 artifacts/ 清掉，
      # 曾导致发布步骤静默跳过（run 绿灯但什么都没推）。
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 不合并 artifact：按行为分目录保存，同名产物才可能被检测到而不是静默覆盖
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Detect artifact name collision
        run: |
          set -euo pipefail
          # 产物文件名不含 behavior，domain 与 ipcidr 出现同名源文件时会互相覆盖
          DUP=$(find artifacts -name '*.mrs' -printf '%f\n' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "::error::多个 behavior 产出了同名产物，会互相覆盖：$(echo "$DUP" | tr '\n' ' ')"
            echo "请给 mihomo/domain 或 mihomo/ipcidr 下的源文件改名，保证 basename 唯一"
            find artifacts -name '*.mrs' | sort
            exit 1
          fi
          echo "产物清单:"
          find artifacts -name '*.mrs' | sort

      - name: Publish to rules branch
        uses: ./.github/actions/publish-rules
        with:
          dir: mihomo
          source-dir: mihomo
          source-patterns: "*.yaml *.txt"
          ext: mrs
          artifact-dir: artifacts
          message: "chore: update mihomo rulesets [skip ci]"
          token: ${{ github.token }}
