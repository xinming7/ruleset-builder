name: Build mihomo Ruleset

on:
  push:
    paths:
      - "mihomo/**"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        behavior: [domain, ipcidr, classical]
    steps:
      - uses: actions/checkout@v4

      - name: Check for source files
        id: check
        run: |
          if ls mihomo/${{ matrix.behavior }}/*.yaml mihomo/${{ matrix.behavior }}/*.txt 2>/dev/null | head -1 > /dev/null; then
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download mihomo
        if: steps.check.outputs.has_files == 'true'
        run: |
          # 通过 GitHub API 获取最新 release 的 linux-amd64 下载链接
          ASSET_URL=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*linux-amd64[^"]*"' \
            | head -1 \
            | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: 无法获取 mihomo 下载链接"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o mihomo-dl
          # 处理可能的压缩格式
          if file mihomo-dl | grep -q gzip; then
            mv mihomo-dl mihomo.gz && gunzip mihomo.gz
          elif file mihomo-dl | grep -q "XZ\|xz"; then
            mv mihomo-dl mihomo.xz && unxz mihomo.xz
          elif file mihomo-dl | grep -q Zip; then
            unzip mihomo-dl
          else
            mv mihomo-dl mihomo
          fi
          chmod +x mihomo
          ./mihomo -v

      - name: Build ${{ matrix.behavior }} rulesets
        if: steps.check.outputs.has_files == 'true'
        run: |
          mkdir -p output
          for f in mihomo/${{ matrix.behavior }}/*.yaml mihomo/${{ matrix.behavior }}/*.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/\.\(yaml\|txt\)$//')
            echo "Converting $f -> output/${name}.mrs"
            ./mihomo convert-ruleset ${{ matrix.behavior }} yaml "$f" "output/${name}.mrs"
          done

      - name: Upload artifacts
        if: steps.check.outputs.has_files == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mrs-${{ matrix.behavior }}
          path: output/*.mrs

  commit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Commit compiled rulesets
        run: |
          mkdir -p output/mihomo
          cp artifacts/**/*.mrs output/mihomo/ 2>/dev/null || true
          if ls output/mihomo/*.mrs 2>/dev/null | head -1 > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/mihomo/
            git diff --cached --quiet || git commit -m "chore: update mihomo rulesets [skip ci]"
            git push
          else
            echo "No .mrs files to commit"
          fi
