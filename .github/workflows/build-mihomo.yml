name: Build mihomo Ruleset

on:
  push:
    paths:
      - "mihomo/**/*.yaml"
      - "mihomo/**/*.txt"
    branches: [main]
  workflow_dispatch:
    inputs:
      behavior:
        description: "规则类型 (domain/ipcidr/classical)，留空则全部"
        required: false
      files:
        description: "指定文件名（如 direct.yaml），留空则编译改动的文件"
        required: false

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: set-matrix
        run: |
          BEHAVIORS="[]"
          HAS_CHANGES="false"

          # 手动指定文件模式
          if [ -n "${{ github.event.inputs.files }}" ]; then
            # 手动指定的文件，按目录自动归类 behavior
            for fname in ${{ github.event.inputs.files }}; do
              for beh in domain ipcidr classical; do
                if [ -f "mihomo/$beh/$fname" ]; then
                  BEHAVIORS=$(echo "$BEHAVIORS" | jq -c --arg b "$beh" '. + [$b] | unique')
                fi
              done
            done
            HAS_CHANGES="true"
          # 手动指定 behavior 模式
          elif [ -n "${{ github.event.inputs.behavior }}" ]; then
            BEHAVIORS='["${{ github.event.inputs.behavior }}"]'
            HAS_CHANGES="true"
          # 自动检测改动文件
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'mihomo/' 2>/dev/null || git diff --name-only HEAD -- 'mihomo/')
            for beh in domain ipcidr classical; do
              if echo "$CHANGED" | grep -q "^mihomo/$beh/"; then
                BEHAVIORS=$(echo "$BEHAVIORS" | jq -c --arg b "$beh" '. + [$b] | unique')
              fi
            done
            if [ "$BEHAVIORS" != "[]" ]; then
              HAS_CHANGES="true"
            fi
          fi

          echo "matrix={\"behavior\":$BEHAVIORS}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Detected behaviors: $BEHAVIORS"

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find target files
        id: files
        run: |
          FILES=""
          # 手动指定文件
          if [ -n "${{ github.event.inputs.files }}" ]; then
            for fname in ${{ github.event.inputs.files }}; do
              fpath="mihomo/${{ matrix.behavior }}/$fname"
              if [ -f "$fpath" ]; then
                FILES="$FILES $fpath"
              fi
            done
          else
            # 只取本次改动的文件
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- "mihomo/${{ matrix.behavior }}/" 2>/dev/null || git diff --name-only HEAD -- "mihomo/${{ matrix.behavior }}/")
            for f in $CHANGED; do
              if [[ "$f" == *.yaml || "$f" == *.txt ]]; then
                [ -f "$f" ] && FILES="$FILES $f"
              fi
            done
          fi
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Target files: $FILES"

      - name: Download mihomo
        if: steps.files.outputs.files != ''
        run: |
          ASSET_URL=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*linux-amd64[^"]*"' \
            | head -1 \
            | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: 无法获取 mihomo 下载链接"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o mihomo-dl
          # 列出下载文件信息方便排查
          file mihomo-dl
          # 清理可能存在的旧文件/目录，避免 gunzip/unxz 报 "already exists"
          rm -rf mihomo mihomo.gz mihomo.xz
          if file mihomo-dl | grep -q gzip; then
            mv mihomo-dl mihomo.gz && gunzip -f mihomo.gz
          elif file mihomo-dl | grep -q "XZ\|xz"; then
            mv mihomo-dl mihomo.xz && unxz -f mihomo.xz
          elif file mihomo-dl | grep -q Zip; then
            unzip -o mihomo-dl
          else
            mv -f mihomo-dl mihomo
          fi
          # 如果解压出了目录，找到里面的二进制
          if [ ! -x mihomo ] || file mihomo | grep -q directory; then
            MIBIN=$(find . -path ./mihomo-dl -prune -o -name "mihomo" -type f -print 2>/dev/null | head -1)
            if [ -n "$MIBIN" ]; then
              cp "$MIBIN" ./mihomo
            fi
          fi
          chmod +x mihomo
          ./mihomo -v

      - name: Build ${{ matrix.behavior }} rulesets
        if: steps.files.outputs.files != ''
        run: |
          mkdir -p output
          for f in ${{ steps.files.outputs.files }}; do
            name=$(basename "$f" | sed 's/\.\(yaml\|txt\)$//')
            echo "Converting $f -> output/${name}.mrs"
            ./mihomo convert-ruleset ${{ matrix.behavior }} yaml "$f" "output/${name}.mrs"
          done

      - name: Upload artifacts
        if: steps.files.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: mrs-${{ matrix.behavior }}
          path: output/*.mrs

  commit:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Commit compiled rulesets
        run: |
          mkdir -p output/mihomo
          cp artifacts/**/*.mrs output/mihomo/ 2>/dev/null || true
          if ls output/mihomo/*.mrs 2>/dev/null | head -1 > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add output/mihomo/
            git diff --cached --quiet || git commit -m "chore: update mihomo rulesets [skip ci]"
            git push
          else
            echo "No .mrs files to commit"
          fi
