name: Build mihomo Ruleset

on:
  push:
    paths:
      - "mihomo/**/*.yaml"
      - "mihomo/**/*.txt"
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:
    inputs:
      behavior:
        description: "规则类型 (domain/ipcidr)，留空则全部"
        required: false
        type: choice
        options:
          - ""
          - domain
          - ipcidr
      build_all:
        description: "强制打包所有文件（忽略变更检测）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: push-to-rules
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: set-matrix
        run: |
          BEHAVIORS="[]"
          HAS_CHANGES="false"

          if [ "${{ github.event.inputs.build_all }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -n "${{ github.event.inputs.behavior }}" ]; then
              BEHAVIORS='["${{ github.event.inputs.behavior }}"]'
            else
              BEHAVIORS='["domain","ipcidr"]'
            fi
            HAS_CHANGES="true"
          elif [ -n "${{ github.event.inputs.behavior }}" ]; then
            BEHAVIORS='["${{ github.event.inputs.behavior }}"]'
            HAS_CHANGES="true"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'mihomo/' 2>/dev/null || git diff --name-only HEAD -- 'mihomo/')
            for beh in domain ipcidr; do
              if echo "$CHANGED" | grep -q "^mihomo/$beh/"; then
                BEHAVIORS=$(echo "$BEHAVIORS" | jq -c --arg b "$beh" '. + [$b] | unique')
              fi
            done
            if [ "$BEHAVIORS" != "[]" ]; then
              HAS_CHANGES="true"
            fi
          fi

          echo "matrix={\"behavior\":$BEHAVIORS}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Detected behaviors: $BEHAVIORS"

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo from release
        run: |
          curl -sL "https://github.com/xinming7/ruleset-builder/releases/download/kernel-v1/mihomo-linux-amd64" -o mihomo-bin
          chmod +x mihomo-bin
          ./mihomo-bin -v

      - name: Validate yaml/txt files
        run: |
          pip install pyyaml -q
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/$BEHAVIOR/*.yaml mihomo/$BEHAVIOR/*.txt; do
            [ -f "$f" ] || continue
            echo "Validating $f ..."
            if [[ "$f" == *.yaml ]]; then
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || { echo "ERROR: $f YAML 语法错误"; exit 1; }
            fi
            if [[ "$f" == *.txt ]]; then
              if ! grep -q '[^[:space:]]' "$f"; then
                echo "ERROR: $f 文件为空"
                exit 1
              fi
            fi
          done
          echo "All files passed validation"

      - name: Build ${{ matrix.behavior }} rulesets
        run: |
          mkdir -p output
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/$BEHAVIOR/*.yaml mihomo/$BEHAVIOR/*.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/\.\(yaml\|txt\)$//')
            if [[ "$f" == *.txt ]]; then
              fmt="txt"
            else
              fmt="yaml"
            fi
            echo "Converting $f -> output/${name}.mrs (format=$fmt)"
            ./mihomo-bin convert-ruleset "$BEHAVIOR" "$fmt" "$f" "output/${name}.mrs"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrs-${{ matrix.behavior }}
          path: output/*.mrs

  commit:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 清理孤儿产物需要知道 main 上现存哪些源文件，因此在 commit job 里额外 checkout 一份源码树
      - name: Checkout source tree
        uses: actions/checkout@v4
        with:
          ref: main
          path: src-repo
          fetch-depth: 1

      - name: Checkout rules branch
        uses: actions/checkout@v4
        with:
          ref: rules
          path: rules-repo
          fetch-depth: 1
        continue-on-error: true
        id: checkout-rules

      - name: Init rules branch if not exists
        if: steps.checkout-rules.outcome == 'failure'
        run: |
          rm -rf rules-repo
          mkdir -p rules-repo
          cd rules-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b rules
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          # 复制 README.md 到 rules 分支
          cp "${{ github.workspace }}/rules-README.md" README.md
          git add README.md
          git commit -m "chore: init rules branch with README [skip ci]"

      - name: Push to rules branch
        run: |
          mkdir -p rules-repo/mihomo
          find artifacts -name "*.mrs" -exec cp {} rules-repo/mihomo/ \;

          # 清理孤儿产物：rules 分支上存在、但 main 上已无同名源文件的 .mrs
          # .github/keep-rulesets.txt 可显式保留（每行一个名字，忽略 # 注释与空行）
          KEEP_FILE="src-repo/.github/keep-rulesets.txt"
          : > "$RUNNER_TEMP/keep.txt"
          if [ -f "$KEEP_FILE" ]; then
            sed -e 's/#.*//' -e 's/[[:space:]]//g' "$KEEP_FILE" | grep -v '^$' > "$RUNNER_TEMP/keep.txt" || true
          fi

          find src-repo/mihomo -type f \( -name '*.yaml' -o -name '*.txt' \) -printf '%f\n' \
            | sed -E 's/\.(yaml|txt)$//' | sort -u > "$RUNNER_TEMP/expected-mihomo.txt"
          if [ ! -s "$RUNNER_TEMP/expected-mihomo.txt" ]; then
            echo "::error::未能从 src-repo/mihomo 解析出源文件名，跳过清理以免误删全部产物"
          else
            while IFS= read -r f; do
              name=$(basename "$f" .mrs)
              if grep -Fxq "$name" "$RUNNER_TEMP/expected-mihomo.txt"; then
                continue
              fi
              if grep -Fxq "$name" "$RUNNER_TEMP/keep.txt"; then
                echo "保留孤儿产物: mihomo/$(basename "$f")（命中 keep-rulesets.txt）"
                continue
              fi
              echo "删除孤儿产物: mihomo/$(basename "$f")（main 上已无对应源文件）"
              rm -f "$f"
            done < <(find rules-repo/mihomo -maxdepth 1 -name '*.mrs')
          fi

          if ! ls rules-repo/mihomo/*.mrs 2>/dev/null | head -1 > /dev/null; then
            echo "No .mrs files to commit"
            exit 0
          fi

          cd rules-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A mihomo/
          git diff --cached --quiet || git commit -m "chore: update mihomo rulesets [skip ci]"
          git push --set-upstream origin rules
