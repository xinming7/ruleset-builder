name: Build mihomo Ruleset

on:
  push:
    paths:
      - "mihomo/**/*.yaml"
      - "mihomo/**/*.txt"
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'  # 每周一 UTC 03:00（北京时间 11:00）
  workflow_dispatch:
    inputs:
      behavior:
        description: "规则类型 (domain/ipcidr)，留空则全部"
        required: false
        type: choice
        options:
          - ""
          - domain
          - ipcidr
      build_all:
        description: "强制打包所有文件（忽略变更检测）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: push-to-rules
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_changes: ${{ steps.set-matrix.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: set-matrix
        run: |
          BEHAVIORS="[]"
          HAS_CHANGES="false"

          if [ "${{ github.event.inputs.build_all }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            if [ -n "${{ github.event.inputs.behavior }}" ]; then
              BEHAVIORS='["${{ github.event.inputs.behavior }}"]'
            else
              BEHAVIORS='["domain","ipcidr"]'
            fi
            HAS_CHANGES="true"
          elif [ -n "${{ github.event.inputs.behavior }}" ]; then
            BEHAVIORS='["${{ github.event.inputs.behavior }}"]'
            HAS_CHANGES="true"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'mihomo/' 2>/dev/null || git diff --name-only HEAD -- 'mihomo/')
            for beh in domain ipcidr; do
              if echo "$CHANGED" | grep -q "^mihomo/$beh/"; then
                BEHAVIORS=$(echo "$BEHAVIORS" | jq -c --arg b "$beh" '. + [$b] | unique')
              fi
            done
            if [ "$BEHAVIORS" != "[]" ]; then
              HAS_CHANGES="true"
            fi
          fi

          echo "matrix={\"behavior\":$BEHAVIORS}" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Detected behaviors: $BEHAVIORS"

  build:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download mihomo
        run: |
          ASSET_URL=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" \
            | grep -o '"browser_download_url": *"[^"]*linux-amd64[^"]*"' \
            | head -1 \
            | sed 's/"browser_download_url": *"//;s/"$//')
          if [ -z "$ASSET_URL" ]; then
            echo "ERROR: 无法获取 mihomo 下载链接"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -sL "$ASSET_URL" -o mihomo-bin.gz
          gunzip -f mihomo-bin.gz
          chmod +x mihomo-bin
          ./mihomo-bin -v

      - name: Validate yaml/txt files
        run: |
          pip install pyyaml -q
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/$BEHAVIOR/*.yaml mihomo/$BEHAVIOR/*.txt; do
            [ -f "$f" ] || continue
            echo "Validating $f ..."
            if [[ "$f" == *.yaml ]]; then
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || { echo "ERROR: $f YAML 语法错误"; exit 1; }
            fi
            if [[ "$f" == *.txt ]]; then
              if ! grep -q '[^[:space:]]' "$f"; then
                echo "ERROR: $f 文件为空"
                exit 1
              fi
            fi
          done
          echo "All files passed validation"

      - name: Build ${{ matrix.behavior }} rulesets
        run: |
          mkdir -p output
          BEHAVIOR=${{ matrix.behavior }}
          for f in mihomo/$BEHAVIOR/*.yaml mihomo/$BEHAVIOR/*.txt; do
            [ -f "$f" ] || continue
            name=$(basename "$f" | sed 's/\.\(yaml\|txt\)$//')
            if [[ "$f" == *.txt ]]; then
              fmt="txt"
            else
              fmt="yaml"
            fi
            echo "Converting $f -> output/${name}.mrs (format=$fmt)"
            ./mihomo-bin convert-ruleset "$BEHAVIOR" "$fmt" "$f" "output/${name}.mrs"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mrs-${{ matrix.behavior }}
          path: output/*.mrs

  commit:
    needs: build
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Push to rules branch
        run: |
          mkdir -p release/mihomo
          find artifacts -name "*.mrs" -exec cp {} release/mihomo/ \;
          if ! ls release/mihomo/*.mrs 2>/dev/null | head -1 > /dev/null; then
            echo "No .mrs files to commit"
            exit 0
          fi

          cd release
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b rules

          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch origin rules 2>/dev/null && git reset origin/rules 2>/dev/null || true

          git add .
          git diff --cached --quiet || git commit -m "chore: update mihomo rulesets [skip ci]"
          git push origin rules --force
