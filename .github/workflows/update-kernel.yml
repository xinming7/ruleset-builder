name: Update Kernel

# 从上游（MetaCubeX/mihomo、SagerNet/sing-box）拉取最新稳定版内核，
# 校验通过后覆盖 Release `kernel-v1` 中的固定名资产：
#   mihomo-linux-amd64  /  sing-box-linux-amd64
# 两个构建 workflow 用的就是这两个固定 URL，因此无需任何改动。
# 同时维护 kernel-manifest.json（版本 + SHA256 + 更新时间）与 Release 描述。

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00（北京时间 10:00），早于 03:00 的规则集构建
  workflow_dispatch:
    inputs:
      kernel:
        description: "要更新的内核"
        required: false
        type: choice
        default: all
        options:
          - all
          - mihomo
          - sing-box
      force:
        description: "强制重新下载并覆盖（忽略版本比对与 patch 级限制）"
        required: false
        type: boolean
        default: false

concurrency:
  group: update-kernel
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}   # prepare job 无 checkout，需显式指定仓库
  KERNEL_RELEASE: kernel-v1
  MANIFEST_ASSET: kernel-manifest.json

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      current: ${{ steps.plan.outputs.current }}
    steps:
      - name: Plan
        id: plan
        env:
          KERNEL_INPUT: ${{ github.event.inputs.kernel }}
        run: |
          set -uo pipefail
          mkdir -p .manifest
          if gh release download "$KERNEL_RELEASE" -p "$MANIFEST_ASSET" -D .manifest --clobber 2>/dev/null; then
            echo "已读取现有 manifest"
          else
            # 没有 manifest 就当作"无基线"：两个内核都会走一次完整下载与校验
            echo '{"mihomo":"","sing-box":"","updated_at":null,"assets":{}}' > ".manifest/$MANIFEST_ASSET"
            echo "::notice::manifest 不存在，视为无基线（两个内核都会升级）"
          fi
          MF=".manifest/$MANIFEST_ASSET"
          cat "$MF"

          current=$(jq -c '{mihomo: (.mihomo // ""), "sing-box": (."sing-box" // "")}' "$MF")
          echo "current=${current}" >> "$GITHUB_OUTPUT"

          case "${KERNEL_INPUT:-all}" in
            all|"")
              echo 'matrix={"kernel":["mihomo","sing-box"]}' >> "$GITHUB_OUTPUT"
              ;;
            mihomo|sing-box)
              echo "matrix=$(jq -c -n --arg k "$KERNEL_INPUT" '{kernel: [$k]}')" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::未知的 kernel 取值: $KERNEL_INPUT"
              exit 1
              ;;
          esac

  fetch:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false   # 两个内核互不阻塞：一个失败不取消另一个
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: ver
        env:
          NAME: ${{ matrix.kernel }}
          CURRENT_JSON: ${{ needs.prepare.outputs.current }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -uo pipefail
          case "$NAME" in
            mihomo) REPO="MetaCubeX/mihomo" ;;
            sing-box) REPO="SagerNet/sing-box" ;;
            *) echo "::error::未知内核 $NAME"; exit 1 ;;
          esac

          CURRENT=$(printf '%s' "$CURRENT_JSON" | jq -r --arg k "$NAME" '.[$k] // ""')
          LATEST=$(gh api "repos/$REPO/releases/latest" --jq .tag_name)
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "::error::无法获取 $REPO 的最新版本"
            exit 1
          fi
          echo "上游 $LATEST / 当前 ${CURRENT:-无基线}"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

          CHANGED=true
          if [ "$LATEST" = "$CURRENT" ] && [ "$FORCE" != "true" ]; then
            CHANGED=false
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "$FORCE" != "true" ] && [ -n "$CURRENT" ]; then
            # 定时任务只接受同 minor 的 patch 升级，跨 minor / major 需手动 dispatch + force
            L_MM=$(echo "${LATEST#v}" | cut -d. -f1,2)
            C_MM=$(echo "${CURRENT#v}" | cut -d. -f1,2)
            if [ "$L_MM" != "$C_MM" ]; then
              echo "::notice::上游 $LATEST 跨 minor（当前 $CURRENT），定时任务不自动升级；如需升级请手动触发并勾选 force"
              CHANGED=false
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED"

      - name: Fetch, verify, canary, upload
        id: fetch
        if: steps.ver.outputs.changed == 'true'
        env:
          NAME: ${{ matrix.kernel }}
        run: scripts/fetch-kernel.sh "$NAME" --upload

      - name: Write result
        if: always()
        env:
          NAME: ${{ matrix.kernel }}
          VERSION: ${{ steps.ver.outputs.latest }}
          CHANGED: ${{ steps.ver.outputs.changed }}
          SHA: ${{ steps.fetch.outputs.sha256 }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results
          jq -n --arg n "$NAME" --arg v "${VERSION:-未知}" --arg c "${CHANGED:-false}" \
                --arg s "${SHA:-}" --arg r "$JOB_STATUS" \
            '{name: $n, version: $v, changed: ($c == "true"), sha256: $s, result: $r}' \
            > "results/${NAME}.json"
          cat "results/${NAME}.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-result-${{ matrix.kernel }}
          path: results/${{ matrix.kernel }}.json

  publish:
    needs: [prepare, fetch]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-result-*
          path: results
          merge-multiple: true

      - name: Update manifest
        id: manifest
        run: |
          set -euo pipefail
          echo "=== 本次结果 ==="
          cat results/*.json

          PATCH=$(jq -s '[.[] | select(.result == "success" and .changed)]
                          | map({key: .name, value: {version: .version, sha256: .sha256}})
                          | from_entries' results/*.json)
          CHANGED=$(jq -s '[.[] | select(.result == "success" and .changed) | .name] | join(" ")' results/*.json)
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"

          mkdir -p .manifest
          if ! gh release download "$KERNEL_RELEASE" -p "$MANIFEST_ASSET" -D .manifest --clobber 2>/dev/null; then
            echo '{"mihomo":"","sing-box":"","updated_at":null,"assets":{}}' > ".manifest/$MANIFEST_ASSET"
          fi
          MF=".manifest/$MANIFEST_ASSET"

          if [ "$PATCH" = "{}" ]; then
            echo "没有成功更新的内核，manifest 保持不变"
            exit 0
          fi

          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --argjson patch "$PATCH" --arg ts "$TS" '
            .assets = (.assets // {}) |
            reduce ($patch | to_entries[]) as $e (.;
              (if $e.key == "sing-box" then .["sing-box"] = $e.value.version else .[$e.key] = $e.value.version end)
              | .assets[$e.key] = {sha256: $e.value.sha256}
            ) | .updated_at = $ts
          ' "$MF" > "${MF}.tmp"
          mv "${MF}.tmp" "$MF"
          cat "$MF"
          gh release upload "$KERNEL_RELEASE" "$MF" --clobber

      # 描述始终按 manifest 重渲染：即使本次无变化也执行，避免描述与资产漂移
      - name: Update release notes
        run: |
          set -euo pipefail
          mkdir -p .notes
          if ! gh release download "$KERNEL_RELEASE" -p "$MANIFEST_ASSET" -D .notes --clobber 2>/dev/null; then
            echo "::warning::读取不到 $MANIFEST_ASSET，跳过描述更新"
            exit 0
          fi
          MF=".notes/$MANIFEST_ASSET"
          MV=$(jq -r '.mihomo // "未知"' "$MF")
          SV=$(jq -r '."sing-box" // "未知"' "$MF")
          MS=$(jq -r '.assets.mihomo.sha256 // "未知"' "$MF")
          SS=$(jq -r '.assets["sing-box"].sha256 // "未知"' "$MF")
          TS=$(jq -r '.updated_at // "未知"' "$MF")

          cat > .notes/body.md <<EOF
          <!-- 本描述由 .github/workflows/update-kernel.yml 自动生成，请勿手工修改 -->

          构建内核的**固定名资产**，由 [Update Kernel](https://github.com/xinming7/ruleset-builder/actions/workflows/update-kernel.yml) 每周从上游自动同步，构建 workflow 直接按固定 URL 拉取。

          | 内核 | 版本 | 平台 | SHA256 |
          |---|---|---|---|
          | mihomo | $MV | linux-amd64 (GOAMD64 v1) | \`$MS\` |
          | sing-box | $SV | linux-amd64 | \`$SS\` |

          | 资产 | 用途 |
          |---|---|
          | \`mihomo-linux-amd64\` | \`convert-ruleset\`，把 \`mihomo/**.yaml\` 编译成 \`.mrs\` |
          | \`sing-box-linux-amd64\` | \`rule-set compile\`，把 \`singbox/rules/*.json\` 编译成 \`.srs\` |
          | \`kernel-manifest.json\` | 版本 / SHA256 / 更新时间，供 workflow 比对与追溯 |

          最后更新：$TS

          上游：mihomo <https://github.com/MetaCubeX/mihomo> · sing-box <https://github.com/SagerNet/sing-box>
          EOF

          gh release edit "$KERNEL_RELEASE" --notes-file .notes/body.md
          echo "描述已更新"

      # GITHUB_TOKEN 产生的 release/push 事件不会触发其它 workflow（反递归），必须显式 dispatch
      - name: Dispatch rebuild
        env:
          CHANGED: ${{ steps.manifest.outputs.changed }}
        run: |
          set -euo pipefail
          read -ra NAMES <<< "${CHANGED:-}"
          if [ "${#NAMES[@]}" -eq 0 ]; then
            echo "没有内核变化，不下发构建"
            exit 0
          fi
          for name in "${NAMES[@]}"; do
            case "$name" in
              mihomo) gh workflow run build-mihomo.yml --ref main -f build_all=true ;;
              sing-box) gh workflow run build-singbox.yml --ref main -f build_all=true ;;
            esac
            echo "已触发 ${name} 的规则集重建"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## 内核更新结果"
            echo ""
            echo "| 内核 | 上游最新 | 是否更新 | 结果 | SHA256 |"
            echo "|---|---|---|---|---|"
            jq -r '"| \(.name) | \(.version) | \(if .changed then "是" else "否" end) | \(.result) | \(if (.sha256 // "") == "" then "-" else .sha256 end) |"' results/*.json 2>/dev/null || echo "| - | - | - | 无结果 | - |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any kernel update failed
        if: needs.fetch.result == 'failure'
        run: |
          echo "::error::至少一个内核更新失败，请检查上方日志（可能原因：上游资产命名变更 / 上游回归导致 canary 编译失败）"
          exit 1
